name: CI

on:
  pull_request:
    branches: [dev, prod]

  # Also run on merges into dev, so every dev commit leaves behind an
  # installable debug APK. Without this, CI only ever runs pre-merge and
  # there is no build of dev itself for a tester to download.
  push:
    branches: [dev]

  # Lets a build be re-run on demand from the Actions tab — e.g. when an
  # artifact has aged out and a tester needs a fresh APK.
  workflow_dispatch:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for backend project
        id: check
        run: |
          if [ -f backend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run lint --if-present

      - name: Typecheck
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run typecheck --if-present

      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm test --if-present

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run build --if-present

      - name: No backend code yet
        if: steps.check.outputs.exists == 'false'
        run: echo "backend/package.json not found — design-stage only, nothing to test yet."

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Android project
        id: check
        run: |
          if [ -f android/gradlew ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle build, test, lint
        if: steps.check.outputs.exists == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew build test lint --no-daemon

      # The debug APK is what lets someone test on a real phone without a
      # development machine — which is the difference between the TalkBack
      # spike being runnable by the people it is meant to serve, and it
      # sitting unrun because it needs adb. Debug-signed only: release
      # signing is still undecided (see STATE.md), so this is for testing,
      # never for distribution.
      - name: Upload debug APK
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tew-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          # Fail loudly rather than leaving an empty artifact behind: a
          # tester finding nothing to download reads as "the build is
          # broken", and they would be right.
          if-no-files-found: error
          retention-days: 30

      - name: No Android project yet
        if: steps.check.outputs.exists == 'false'
        run: echo "android/gradlew not found — design-stage only, nothing to test yet."
