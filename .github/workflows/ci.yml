name: CI

on:
  pull_request:
    branches: [dev, prod]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for backend project
        id: check
        run: |
          if [ -f backend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run lint --if-present

      - name: Typecheck
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run typecheck --if-present

      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm test --if-present

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: npm run build --if-present

      - name: No backend code yet
        if: steps.check.outputs.exists == 'false'
        run: echo "backend/package.json not found — design-stage only, nothing to test yet."

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Android project
        id: check
        run: |
          if [ -f android/gradlew ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle build, test, lint
        if: steps.check.outputs.exists == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew build test lint --no-daemon

      - name: No Android project yet
        if: steps.check.outputs.exists == 'false'
        run: echo "android/gradlew not found — design-stage only, nothing to test yet."
